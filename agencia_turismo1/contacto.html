<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Explora Quito</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header class="header">
    <div class="logo-container">
      <img src="imagenes/logo.png" alt="Logo Explora Quito" class="logo">
      <h1>Explora <span>Quito</span></h1>
    </div>
    <nav class="menu">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="destinos.html">Destinos</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Sección Contacto -->
  <section class="atractivos">
    <h2>Formulario de Contacto / Reserva</h2>
    <form class="formulario">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="destino">Destino o actividad:</label>
      <select id="destino" name="destino" required>
        <option value="">Seleccione...</option>
        <option value="cultural">Tour Cultural</option>
        <option value="gastronomico">Tour Gastronómico</option>
        <option value="aventura">Tour de Aventura</option>
        <option value="finsemana">Paquete Fin de Semana</option>
      </select>

      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" name="fecha" required>

      <label for="personas">Número de personas:</label>
      <input type="number" id="personas" name="personas" min="1" required>

      <label for="servicio">Tipo de servicio:</label>
      <input type="text" id="servicio" name="servicio" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="4"></textarea>

      <button type="submit" class="btn btn-dorado">Enviar</button>
    </form>
  </section>

  <!-- Pie de página -->
  <footer class="footer">
    <p>&copy; 2026 Explora Quito | Proyecto académico - UTEQ</p>
  </footer>
</body>
</html>
